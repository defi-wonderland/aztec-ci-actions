# .github/workflows/update-v0-tag.yml
name: Update v0 tag

on:
  push:
    tags:
      - 'v0.*.*'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update v0 to latest v0.x.x
        run: |
          LATEST=$(git tag -l | grep -E '^v0\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          git tag -f v0 "$LATEST"
          git push origin v0 --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}